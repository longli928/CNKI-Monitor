plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.example.cnkilsposed'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.example.cnkilsposed'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // LSPosed/Xposed API is compile-time only; it is supplied by the runtime.
    compileOnly 'de.robv.android.xposed:api:82'
}
